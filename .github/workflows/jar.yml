name: Jar

# Builds the mod and prints only the jar (base64) - a small log for fetching the jar.
on:
  workflow_dispatch:

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod jar
        run: ./gradlew build -x test --no-configuration-cache -q

      - name: Mod jar (base64)
        run: for f in build/libs/*.jar; do echo "JARNAME $(basename $f)"; base64 -w 6000 "$f" | sed 's/^/JARB64 /'; done

      - name: Server smoke test (failures only)
        run: |
          mkdir -p run-smoke
          echo "eula=true" > run-smoke/eula.txt
          printf 'online-mode=false\nlevel-seed=20260930\nspawn-protection=0\nsync-chunk-writes=false\nmax-tick-time=-1\n' > run-smoke/server.properties
          timeout 1500 ./gradlew runSmokeServer --no-configuration-cache > smoke.log 2>&1 || true
          grep -v SMOKEPNG smoke.log | grep -E "FAIL|ERROR|Exception|Caused by|at com.thesift|PASSED" | cut -c1-400 | head -150 || true
