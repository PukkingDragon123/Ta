name: Jar

# Builds the mod and prints only the jar (base64) - a small log for fetching the jar.
on:
  workflow_dispatch:

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod jar
        run: ./gradlew build -x test --no-configuration-cache -q

      - name: Mod jar (base64)
        run: for f in build/libs/*.jar; do echo "JARNAME $(basename $f)"; base64 -w 6000 "$f" | sed 's/^/JARB64 /'; done
