name: API Probe

on:
  workflow_dispatch:
    inputs:
      commands:
        description: "Semicolon separated probe commands: 'javap <class>' | 'list <package>' | 'src <class>' | 'grep <regex>'"
        required: true
  push:
    paths:
      - '.github/probe.txt'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Restore decompiled Minecraft cache
        id: mccache
        uses: actions/cache@v4
        with:
          path: /home/runner/mc
          key: mc-decomp-26.3.0.23-beta-v2
      - name: Create Minecraft artifacts
        if: steps.mccache.outputs.cache-hit != 'true'
        run: |
          ./gradlew createMinecraftArtifacts --no-configuration-cache -q --no-daemon
          mkdir -p /home/runner/mc/src
          cp build/moddev/artifacts/minecraft-patched-*.jar /home/runner/mc/mc.jar
          curl -sSL -o /tmp/vf.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.12.0/vineflower-1.12.0.jar
          java -Xmx6G -jar /tmp/vf.jar -din=1 -rbr=1 -dgs=1 -asc=1 -rsy=1 -iec=1 -jvn=1 -log=WARN -thr=4 /home/runner/mc/mc.jar /home/runner/mc/src > /tmp/vf.log 2>&1 || tail -50 /tmp/vf.log
          cd /home/runner/mc/src && if ls *.jar >/dev/null 2>&1; then unzip -q -o *.jar && rm -f *.jar; fi
          find /home/runner/mc/src -name '*.java' | wc -l
      - name: Probe
        env:
          COMMANDS: ${{ github.event.inputs.commands }}
        run: |
          set +e
          JAR=/home/runner/mc/mc.jar
          cd /home/runner/mc/src
          if [ -n "$COMMANDS" ]; then echo "$COMMANDS" | tr ';' '\n' > /tmp/cmds.txt; else cp $GITHUB_WORKSPACE/.github/probe.txt /tmp/cmds.txt; fi
          while IFS= read -r line; do
            line="$(echo "$line" | sed 's/^ *//;s/ *$//')"
            [ -z "$line" ] && continue
            cmd="${line%% *}"; arg="${line#* }"
            echo "=================== $line"
            case "$cmd" in
              javap) javap -p -cp "$JAR" "$arg" ;;
              list) p="${arg//.//}"; find "$p" -name '*.java' | sort | awk -F/ '{f=$NF; sub(/\.java$/,"",f); d=$0; sub("/[^/]*$","",d); if(d!=last){printf "\n%s: ",d; last=d} printf "%s ",f} END{print ""}' ;;
              src) f="${arg//.//}.java"; cat "$f" ;;
              sig) f="${arg//.//}.java"; grep -nE '^\s*(public|protected|private|static|abstract|final|default|record|class|interface|enum|@)' "$f" | grep -v '^\s*[0-9]*:\s*import' ;;
              imp) f="${arg//.//}.java"; grep '^import ' "$f" ;;
              lines) set -- $arg; f="${1//.//}.java"; sed -n "${2},${3}p" "$f" ;;
              grep) grep -rnE --include=*.java "$arg" . | head -3000 ;;
              find) find . -name "$arg" | head -100 ;;
              *) echo "unknown command $cmd" ;;
            esac
          done < /tmp/cmds.txt
          echo "=================== END"
