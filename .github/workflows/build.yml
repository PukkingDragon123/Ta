name: Build

on:
  push:
    paths-ignore:
      - '.github/probe.txt'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod jar
        run: ./gradlew build --no-configuration-cache --stacktrace

      - name: Mod jar (base64)
        run: for f in build/libs/*.jar; do echo "JARNAME $(basename $f)"; base64 -w 6000 "$f" | sed 's/^/JARB64 /'; done

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: the-sift-neoforge
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Smoke test (headless server, generates The Sift)
        id: smoke
        continue-on-error: true
        run: |
          mkdir -p run-smoke
          echo "eula=true" > run-smoke/eula.txt
          printf 'online-mode=false\nlevel-seed=20260930\nspawn-protection=0\nsync-chunk-writes=false\nmax-tick-time=-1\n' > run-smoke/server.properties
          timeout 1500 ./gradlew runSmokeServer --no-configuration-cache > smoke.log 2>&1 || true
          grep -v SMOKEPNG smoke.log | grep -E "SMOKE|ERROR|Exception|Caused by|at com.thesift|WARN.*thesift|Failed|failed" | head -600 || true
          grep -q "SMOKE TEST PASSED" smoke.log

      - name: Smoke test images (base64)
        if: always()
        run: grep SMOKEPNG smoke.log | sed 's/.*SMOKEPNG/SMOKEPNG/' || true

      - name: Client smoke test (virtual display, software OpenGL, screenshots)
        id: client
        continue-on-error: true
        run: |
          test -f run-smoke/world/level.dat
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libgles2 mesa-utils > /dev/null
          python3 -m pip install --quiet --break-system-packages nbtlib pillow
          mkdir -p run-client/saves
          rm -rf run-client/saves/smoke
          cp -r run-smoke/world run-client/saves/smoke
          rm -f run-client/saves/smoke/session.lock
          python3 .github/scripts/prepare_client_world.py run-client/saves/smoke/level.dat
          printf 'onboardAccessibility:false\npauseOnLostFocus:false\ntutorialStep:none\nrenderDistance:8\nsimulationDistance:6\nnarrator:0\nsoundCategory_master:0.0\njoinedFirstServer:true\nskipMultiplayerWarning:true\nmaxFps:60\n' > run-client/options.txt
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          xvfb-run -a glxinfo -B 2>&1 | head -12 || true
          # the game wants an sRGB-capable framebuffer, which Xvfb's GLX visuals lack; Mesa's EGL has it
          export SDL_VIDEO_FORCE_EGL=1
          (timeout 2400 xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runSmokeClient --no-configuration-cache > client.log 2>&1 || true) &
          pid=$!
          # don't sit on the "no graphics backend" dialog for the whole timeout
          while kill -0 $pid 2>/dev/null; do
            if grep -q "No supported graphics backend\|Failed to create backend Vulkan" client.log 2>/dev/null; then
              echo "graphics backend failed; stopping"; sleep 5; pkill -f runSmokeClient || true; pkill -f java || true; break
            fi
            sleep 10
          done
          wait $pid || true
          grep -E "CLIENTSMOKE|ERROR|Exception|Caused by|at com.thesift|Backend|backend|OpenGL|Renderer|crash" client.log | head -500 || true
          tail -40 client.log
          ls -la run-client/screenshots || true
          grep -q "CLIENTSMOKE PASSED" client.log

      - name: Client screenshots (base64 JPEG)
        if: always()
        run: python3 .github/scripts/print_shots.py run-client/screenshots || true

      - name: Client smoke test on Vulkan (software lavapipe, informational)
        id: client_vk
        continue-on-error: true
        if: steps.client.outcome == 'success'
        run: |
          sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1 vulkan-tools > /dev/null
          rm -rf run-client-vk && mkdir -p run-client-vk/saves
          cp -r run-smoke/world run-client-vk/saves/smoke
          rm -f run-client-vk/saves/smoke/session.lock
          python3 .github/scripts/prepare_client_world.py run-client-vk/saves/smoke/level.dat
          cp run-client/options.txt run-client-vk/options.txt
          xvfb-run -a vulkaninfo --summary 2>&1 | grep -E "apiVersion|deviceName|driverName" | head -6 || true
          unset SDL_VIDEO_FORCE_EGL
          timeout 1500 xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runSmokeClientVulkan --no-configuration-cache > client-vk.log 2>&1 || true
          grep -E "CLIENTSMOKE|ERROR|Exception|Caused by|at com.thesift|Vulkan|backend" client-vk.log | head -300 || true
          tail -20 client-vk.log
          grep -q "CLIENTSMOKE PASSED" client-vk.log

      - name: Vulkan screenshots (base64 JPEG)
        if: always()
        run: python3 .github/scripts/print_shots.py run-client-vk/screenshots VK || true

      - name: Upload smoke test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            smoke.log
            client.log
            client-vk.log
            run-client/crash-reports/
            run-client-vk/crash-reports/
          if-no-files-found: ignore

      - name: Upload client screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-screenshots
          path: |
            run-client/screenshots/
            run-client-vk/screenshots/
          if-no-files-found: ignore

      - name: Check smoke test results
        if: always()
        run: |
          echo "server smoke: ${{ steps.smoke.outcome }}, client smoke: ${{ steps.client.outcome }}, vulkan (informational): ${{ steps.client_vk.outcome }}"
          test "${{ steps.smoke.outcome }}" = "success"
          test "${{ steps.client.outcome }}" = "success"
