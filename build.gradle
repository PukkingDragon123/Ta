plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id

base {
    archivesName = 'the-sift-neoforge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        smokeServer {
            server()
            programArgument '--nogui'
            systemProperty 'thesift.smoketest', 'true'
            systemProperty 'java.awt.headless', 'true'
            gameDirectory = project.file('run-smoke')
        }
        smokeClient {
            client()
            systemProperty 'thesift.clientsmoke', 'true'
            programArguments.addAll '--quickPlaySingleplayer', 'smoke', '--width', '1280', '--height', '720', '--graphicsBackend', 'opengl'
            gameDirectory = project.file('run-client')
        }
        smokeClientVulkan {
            client()
            systemProperty 'thesift.clientsmoke', 'true'
            systemProperty 'thesift.clientsmoke.quick', 'true'
            programArguments.addAll '--quickPlaySingleplayer', 'smoke', '--width', '1280', '--height', '720', '--graphicsBackend', 'vulkan'
            gameDirectory = project.file('run-client-vk')
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '3000', '-Xlint:-deprecation', '-Xlint:-removal'])
}
